name: Build & Test BEAST GRAVITY

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Use the runner's preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Decode release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.BG_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BG_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Gradle build (APK debug, APK release, AAB release)
        working-directory: android
        env:
          BG_KEYSTORE_PASSWORD: ${{ secrets.BG_KEYSTORE_PASSWORD }}
          BG_KEY_ALIAS: ${{ secrets.BG_KEY_ALIAS }}
          BG_KEY_PASSWORD: ${{ secrets.BG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: beast-gravity-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
      - name: Publish APK/AAB to the apk-builds branch and a GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/BeastGravity-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk out/BeastGravity-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/BeastGravity-release.aab
          cd out
          git init -q -b apk-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "BEAST GRAVITY build ${VERSION_NAME} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-builds
          cd ..
          gh release delete latest-build -y --cleanup-tag || true
          gh release create latest-build out/* --target "$GITHUB_SHA" --prerelease --title "BEAST GRAVITY ${VERSION_NAME}" --notes "Build automatique (APK debug, APK release, AAB release)."
